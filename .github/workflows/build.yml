name: Build & Release Blotify

on:
  push:
    tags: ['v*']          # e.g. v1.0.0 → full build + GitHub Release
  workflow_dispatch:      # manual run from Actions tab → build only, no release

permissions:
  contents: write         # needed to create GitHub Releases

jobs:
  # ── Build each platform in parallel ──────────────────────────────────────
  build:
    strategy:
      fail-fast: false    # keep other platforms running if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            electron_flag: --linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

          - os: macos-latest
            platform: darwin
            electron_flag: --mac
            artifact_glob: dist/*.dmg

          - os: windows-latest
            platform: win32
            electron_flag: --win
            artifact_glob: dist/*.exe

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ── Python + uv ───────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies (including PyInstaller)
        run: uv sync --group dev

      # ── Linux system deps for electron-builder ────────────────────────────
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg

      # ── Download the spotdl standalone binary for this platform ───────────
      - name: Download spotdl binary
        run: node scripts/download-bins.js --platform ${{ matrix.platform }}

      # ── Compile our FastAPI server to a native binary via PyInstaller ─────
      - name: Build server binary
        run: uv run python scripts/build-server.py

      # ── Package everything into a distributable installer ─────────────────
      - name: Build Electron app
        run: npx electron-builder ${{ matrix.electron_flag }} --publish never
        env:
          # Suppress electron-builder's update check (keeps logs clean)
          EP_PRE_RELEASE: false

      # ── Save the installer as a workflow artifact ─────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blotify-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  # ── Create a GitHub Release when a version tag is pushed ─────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only runs on tag pushes (not workflow_dispatch)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          draft: false
          generate_release_notes: true   # auto-generates changelog from commits
          fail_on_unmatched_files: true
